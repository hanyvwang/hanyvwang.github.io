  - title: "When Demographic Labels Substitute for Mechanisms: Misclassification of Exposure Pathways and Susceptibility in Environmental Health Research"
    authors: "Analytical frameworks typically emphasize climate exposure, demographic and socioeconomic variables, while overlooking other factors that shape differential exposure. This approach risks obscuring the exposure pathways, thereby conflating socially patterned exposure with intrinsic biological sensitivity."
    # conference_short: R
    # conference: International Conference on Medical Image Computing and Computer-Assisted Intervention <strong>(MICCAI)</strong>, 2023.
    pdf: assets/files/expose.pdf

  - title: "In the Age of AI, What Should Public Health Researchers Do?"
    authors: "As AI takes over analysis and execution, researchers must define what problems matter, recognize risks before they appear in datasets, and ensure that public health action remains grounded in social reality and practical wisdom."
    # conference_short: R
    # conference: International Conference on Medical Image Computing and Computer-Assisted Intervention <strong>(MICCAI)</strong>, 2023.
    pdf: assets/files/ai.pdf
