  - title: "Quantitative Methods for Infectious Disease Epidemiology"
    authors: "This project implements core quantitative models in infectious diseases, including transmission and household models, R0 estimation, Bayesian MCMC inference, hidden Markov models, vaccine efficacy models, time series methods (ARIMA, TSIR), and network-based transmission models."
